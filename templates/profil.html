{% extends "base.html" %}

{% block content %}
  <h1>Profil</h1>
  <div class="profile-grid">
    <div class="card">
      <h2>Dane konta</h2>
      <p><strong>Imie i nazwisko:</strong> {{ current_user.name }}</p>
      <p><strong>Email:</strong> {{ current_user.email }}</p>
      <p><strong>Rola:</strong> <span class="tag">{{ current_user.role }}</span></p>
    </div>
    <div class="card">
      <h2>Rola</h2>
      <p class="note">Rolę nadaje administrator (panel <code>/admin</code>).</p>
    </div>
  </div>
{% endblock %}
