{% extends "base.html" %}

{% block content %}
  <h1>Panel administratora</h1>
  <div class="card" style="max-width:420px;">
    <p class="note">Dostęp do panelu chroniony hasłem.</p>
    <form method="post" action="/admin/login">
      <div class="field">
        <label for="admin-pass">Hasło administratora</label>
        <input id="admin-pass" name="password" type="password" required autofocus>
      </div>
      <button type="submit">Zaloguj</button>
    </form>
  </div>
{% endblock %}
