<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ title or "Internships App" }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
      body {
        font-family: Arial, sans-serif;
        margin: 0;
        background: #f6f6f6;
        color: #222;
      }
      header {
        background: #0b4f6c;
        color: #fff;
        padding: 16px 24px;
      }
      nav a {
        color: #fff;
        margin-right: 16px;
        text-decoration: none;
        font-weight: 600;
      }
      nav a:hover {
        text-decoration: underline;
      }
      main {
        max-width: 920px;
        margin: 24px auto;
        background: #fff;
        padding: 24px;
        border-radius: 8px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }
      footer {
        text-align: center;
        padding: 16px;
        color: #555;
      }
      .card {
        background: #f0f4f8;
        padding: 16px;
        border-radius: 6px;
      }
      label {
        display: block;
        margin-bottom: 6px;
        font-weight: 600;
      }
      input, textarea {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 6px;
        margin-bottom: 12px;
      }
      button {
        background: #0b4f6c;
        color: #fff;
        padding: 10px 16px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: 600;
      }
      button:hover {
        background: #093b52;
      }
      .note {
        font-size: 0.9rem;
        color: #555;
      }
    </style>
  </head>
  <body>
    <header>
      <nav>
        <a href="/">Home</a>
        <a href="/kontakt">Kontakt</a>
        <a href="/hobby">Hobby</a>
        <a href="/formularz">Formularz</a>
      </nav>
    </header>
    <main>
      {% block content %}{% endblock %}
    </main>
    <footer>
      Aplikacja Dokumentacji Praktyk Zawodowych
    </footer>
  </body>
</html>
