{% extends "base.html" %}

{% block content %}
  <h1>Formularz praktyk</h1>
  <p class="note">Wyslanie formularza zwraca JSON i zapisuje dane do pliku .json.</p>
  <form method="post" action="/formularz" id="practice-form">
    <label for="name">Imie i nazwisko</label>
    <input id="name" name="name" type="text" required>

    <label for="email">Email</label>
    <input id="email" name="email" type="email" required>

    <label for="message">Uwagi</label>
    <textarea id="message" name="message" rows="4" required></textarea>

    <h2>Dziennik praktyk</h2>
    <div class="table-wrap">
      <table class="journal-table" id="journal-table">
        <thead>
          <tr>
            <th>Data</th>
            <th>Czynnosc</th>
            <th>Godziny</th>
            <th>Akcje</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td><input name="entry_date" type="date" required></td>
            <td><input name="entry_activity" type="text" required></td>
            <td><input name="entry_hours" type="number" min="1" max="12" required></td>
            <td>
              <button type="button" class="danger" data-remove>Usun</button>
            </td>
          </tr>
        </tbody>
      </table>
    </div>

    <div class="table-actions">
      <button type="button" class="secondary" id="add-row">Dodaj wiersz</button>
    </div>

    <button type="submit">Wyslij</button>
  </form>

  <script>
    const tableBody = document.querySelector("#journal-table tbody");
    const addRowButton = document.getElementById("add-row");

    const createRow = () => {
      const row = document.createElement("tr");
      row.innerHTML = `
        <td><input name="entry_date" type="date" required></td>
        <td><input name="entry_activity" type="text" required></td>
        <td><input name="entry_hours" type="number" min="1" max="12" required></td>
        <td><button type="button" class="danger" data-remove>Usun</button></td>
      `;
      return row;
    };

    const bindRow = (row) => {
      const removeButton = row.querySelector("[data-remove]");
      removeButton.addEventListener("click", () => {
        if (tableBody.rows.length > 1) {
          row.remove();
        }
      });
    };

    if (tableBody.rows.length) {
      bindRow(tableBody.rows[0]);
    }

    addRowButton.addEventListener("click", () => {
      const row = createRow();
      tableBody.appendChild(row);
      bindRow(row);
    });
  </script>
{% endblock %}
